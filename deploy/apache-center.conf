# =============================================================================
#  EduSkill Center — Apache sub-path mount for https://eduskillindia.org/center
# =============================================================================
#
#  !!  WARNING — READ BEFORE YOU TOUCH THE EXISTING VHOST  !!
#
#  1. BACK UP the existing vhost first:
#       sudo cp /etc/apache2/sites-available/eduskillindia.org-le-ssl.conf \
#               /etc/apache2/sites-available/eduskillindia.org-le-ssl.conf.bak.$(date +%F-%H%M)
#     (RHEL/CentOS/AlmaLinux: the file usually lives in /etc/httpd/conf.d/.)
#  2. This is NOT a full <VirtualHost>. Copy the block below INSIDE the EXISTING
#     <VirtualHost *:443> for eduskillindia.org. Nothing else in that file changes.
#  3. Required modules — enable them once, then restart Apache ONCE:
#       sudo a2enmod proxy proxy_http headers rewrite
#       sudo systemctl restart apache2
#     (RHEL: the modules are usually already loaded via /etc/httpd/conf.modules.d/.)
#     Enabling a module needs a restart; the config change below only needs a reload.
#  4. Verify, then RELOAD:
#       sudo apachectl configtest && sudo systemctl reload apache2
#       # RHEL:  sudo apachectl configtest && sudo systemctl reload httpd
#  5. If configtest fails, restore the backup and reload again.
#
#  The app is BUILT with BASE_PATH="/center" and therefore EXPECTS the /center
#  prefix in the path it receives. That is why the ProxyPass target below ends
#  in /center — target and source must match, so the prefix survives.
# =============================================================================


    # --- Uploaded documents can be a few MB (default would reject them). -------
    # 26214400 bytes = 25 MB. If the vhost already sets a larger value, keep it.
    LimitRequestBody 26214400

    # --- Do not let mod_proxy touch anything except /center --------------------
    # ProxyRequests must stay Off (it is off by default). Turning it On would
    # make the server an open forward proxy.
    ProxyRequests Off

    # Keep the browser's Host header so the app's same-origin (CSRF) check and
    # its generated links see eduskillindia.org, not 127.0.0.1:3001.
    ProxyPreserveHost On

    # --- The bare path: /center (no trailing slash) ----------------------------
    # Do NOT add a `RewriteRule ^/center$ /center/ [R=301,L]` here. Verified
    # against a real BASE_PATH=/center build: Next serves /center with 200 and
    # redirects /center/ back to /center (308), so forcing the trailing slash
    # creates an infinite redirect loop. The ProxyPass prefix below already
    # matches the bare /center, so nothing extra is needed.

    ProxyPass        /center http://127.0.0.1:3001/center connectiontimeout=10 timeout=120 retry=0
    ProxyPassReverse /center http://127.0.0.1:3001/center

    # Tell the app the public scheme is https (it sits behind TLS termination).
    # Needs mod_headers (a2enmod headers).
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host  "eduskillindia.org"

    # Long-cache the hashed build assets. Needs mod_headers; mod_expires optional.
    <LocationMatch "^/center/_next/static/">
        Header always set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

# =============================================================================
#  NOTES
# =============================================================================
#  * Do NOT add `ProxyPass /center/_next ...` separately — the /center rule above
#    already covers it. Apache matches the longest prefix first; a second rule
#    only creates a chance to get the two out of sync after an upgrade.
#  * If the existing site uses `ProxyPass / http://...` (i.e. the whole domain is
#    already proxied to another app), put the two /center lines ABOVE that rule.
#    Apache evaluates ProxyPass directives in file order, so a `/` rule placed
#    first would swallow /center.
#  * If the existing site is plain PHP/static files, no ordering issue exists.
#  * Apache 2.4.47+ can also do `ProxyPass /center unix:...`; not needed here.
# =============================================================================
