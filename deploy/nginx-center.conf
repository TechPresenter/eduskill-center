# =============================================================================
#  EduSkill Center — nginx sub-path mount for https://eduskillindia.org/center
# =============================================================================
#
#  !!  WARNING — READ BEFORE YOU TOUCH THE EXISTING VHOST  !!
#
#  1. BACK UP the existing vhost first:
#       sudo cp /etc/nginx/sites-available/eduskillindia.org \
#               /etc/nginx/sites-available/eduskillindia.org.bak.$(date +%F-%H%M)
#  2. This file is NOT a server block. Do NOT drop it into sites-enabled/ as-is.
#     Copy the block below INSIDE the EXISTING `server { ... }` that already
#     listens on 443 for eduskillindia.org. Nothing else in that file changes.
#     (Alternative: save it as /etc/nginx/snippets/eduskill-center.conf and add
#      one line inside the server block:  include snippets/eduskill-center.conf;)
#  3. Verify, then RELOAD — never `restart`, a reload drops no connections:
#       sudo nginx -t && sudo systemctl reload nginx
#  4. If `nginx -t` fails, restore the backup and reload again. The existing
#     site keeps running the whole time because the old config stays loaded
#     until a reload succeeds.
#
#  The app itself listens on 127.0.0.1:3001 only (see deploy/eduskill-center.service),
#  so it is never reachable from the internet except through this block.
#
#  The Next.js app is BUILT with BASE_PATH="/center", which means it expects to
#  receive the "/center" prefix in the request path. That is why proxy_pass has
#  NO trailing slash and NO URI part: nginx then forwards the original URI
#  untouched (/center/login -> http://127.0.0.1:3001/center/login).
#  Writing `proxy_pass http://127.0.0.1:3001/;` would STRIP /center and every
#  page would 404. This single character is the most common mistake here.
# =============================================================================


    # --- Uploaded documents (Aadhaar, marksheets, photos) can be a few MB. -----
    # The default is 1m, which makes the upload fail with 413 before it reaches
    # the app. If the existing server block already sets a LARGER value, leave
    # that one alone and delete this line.
    client_max_body_size 25m;

    # --- The bare path: /center (no trailing slash) -----------------------------
    # VERIFIED against a real BASE_PATH=/center production build: Next serves
    # /center with 200 and answers /center/ with "308 -> /center". So this must
    # be a PROXY, not a redirect to /center/ — a `return 301 /center/;` here
    # would bounce against Next's 308 and produce ERR_TOO_MANY_REDIRECTS on the
    # exact URL visitors type. Do not "helpfully" add the trailing slash back.
    location = /center {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;
    }

    # --- Immutable build assets: /center/_next/static/... ----------------------
    # These filenames contain a content hash, so they can be cached forever.
    # This block must come BEFORE the generic /center/ block (a longer prefix
    # wins in nginx, so order in the file does not strictly matter, but keeping
    # it above is clearer for whoever reads the vhost next).
    location /center/_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Serve from the browser cache for a year; the hash changes on rebuild.
        proxy_cache_valid 200 365d;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # --- The application -------------------------------------------------------
    location /center/ {
        # No trailing slash, no path: pass the URI through unchanged, including
        # the /center prefix that the BASE_PATH build is expecting.
        proxy_pass http://127.0.0.1:3001;

        # HTTP/1.1 + upgrade handling. Next.js uses it for streaming/RSC payloads
        # and for the dev websocket; harmless and required in production too.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;   # see map{} note below

        # Identity headers. The app reads these:
        #   Host / X-Forwarded-Host -> same-origin (CSRF) check in src/lib/api/handler.ts
        #   X-Real-IP / X-Forwarded-For -> audit log + rate limiting
        #   X-Forwarded-Proto -> so the app knows the public scheme is https
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Reports (Excel/PDF export) and bulk location imports can be slow.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # Let the app stream responses instead of nginx holding them back.
        proxy_buffering off;
        proxy_request_buffering off;

        # Do not let a stale upstream redirect rewrite the Location header.
        proxy_redirect off;
    }

# =============================================================================
#  ONE MORE LINE, OUTSIDE THE server{} BLOCK
# =============================================================================
#  `$connection_upgrade` is not built in. If your nginx.conf does not already
#  define it (grep for it first: `grep -r connection_upgrade /etc/nginx/`), add
#  this map at the TOP LEVEL of /etc/nginx/nginx.conf inside `http { ... }`:
#
#      map $http_upgrade $connection_upgrade {
#          default upgrade;
#          ''      close;
#      }
#
#  If you prefer not to edit nginx.conf, replace the two Upgrade/Connection
#  lines above with a plain:   proxy_set_header Connection "";
#  Everything in this app works fine that way as well.
# =============================================================================
